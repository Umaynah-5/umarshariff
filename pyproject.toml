[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "claude-ocr"
version = "0.1.0"
description = "OCR MCP server for Claude — extracts text from images and PDFs using Claude's vision API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.50.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.scripts]
claude-ocr = "claude_ocr.server:main"

[tool.setuptools.packages.find]
where = ["src"]
