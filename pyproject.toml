[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tools"
version = "0.2.0"
description = "MCP tools for Claude — OCR and file-to-Markdown conversion"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.50.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "markitdown[all]>=0.1.0",
]

[project.scripts]
claude-ocr = "claude_ocr.server:main"
claude-markitdown = "markitdown_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
